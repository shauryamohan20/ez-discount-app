api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "tiered-discount"
type = "function"
uid = "4099471b-46b5-d5b4-a975-2269a5424228c32aed17"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  # Free shipping for whole order thresholds. Shopify runs it only for
  # discounts saved with the SHIPPING class.
  [[extensions.targeting]]
  target = "cart.delivery-options.discounts.generate.run"
  input_query = "src/cart_delivery_options_discounts_generate_run.graphql"
  export = "cart-delivery-options-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  # Where the Shopify admin opens this app when a merchant creates or opens one
  # of its discounts from the admin's own Discounts page. :functionId and :id
  # are filled in by the admin. Both routes look the discount up and send the
  # merchant to the right tab, since one Function backs every kind of discount.
  [extensions.ui.paths]
  create = "/app/discount/:functionId/new"
  details = "/app/discount/:functionId/:id"

  # Collection membership cannot be resolved inside the function, so the
  # selected collection IDs are passed into the input query as variables.
  # They come from this metafield, whose top level keys are the variable names.
  [extensions.input.variables]
  namespace = "$app:tiered"
  key = "input-variables"
