api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "tiered-discount"
type = "function"
uid = "4099471b-46b5-d5b4-a975-2269a5424228c32aed17"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  # Collection membership cannot be resolved inside the function, so the
  # selected collection IDs are passed into the input query as variables.
  # They come from this metafield, whose top level keys are the variable names.
  [extensions.input.variables]
  namespace = "$app:tiered"
  key = "input-variables"
