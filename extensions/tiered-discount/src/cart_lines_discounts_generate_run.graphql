query CartInput($collectionIds: [ID!] = []) {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inSelectedCollection: inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:tiered", key: "config") {
      jsonValue
    }
  }
}