query CartInput(
  $collectionIds: [ID!] = []
  $buyCollectionIds: [ID!] = []
  $getCollectionIds: [ID!] = []
  $scheduleStart: TimeWithoutTimezone = "00:00:00"
  $scheduleEnd: TimeWithoutTimezone = "00:00:00"
) {
  shop {
    localTime {
      date
      afterScheduleStart: timeAfter(time: $scheduleStart)
      afterScheduleEnd: timeAfter(time: $scheduleEnd)
    }
  }
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        numberOfOrders
      }
    }
    cost {
      subtotalAmount {
        amount
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inSelectedCollection: inAnyCollection(ids: $collectionIds)
            inBuyCollection: inAnyCollection(ids: $buyCollectionIds)
            inGetCollection: inAnyCollection(ids: $getCollectionIds)
          }
        }
      }
    }
  }
  presentmentCurrencyRate
  discount {
    discountClasses
    metafield(namespace: "$app:tiered", key: "config") {
      jsonValue
    }
  }
}
